<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Cliply — Личный кабинет</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; background: #0A0A0F; color: #fff; min-height: 100vh; }
  .layout { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }
  .sidebar { background: #141414; border-right: 1px solid #27272a; padding: 24px 16px; display: flex; flex-direction: column; }
  .sidebar-logo { font-weight: 800; font-size: 22px; font-family: 'Manrope'; background: linear-gradient(135deg, #6C5CE7, #A29BFE); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-decoration: none; margin-bottom: 40px; display: block; }
  .nav-menu { list-style: none; flex: 1; }
  .nav-menu li { margin-bottom: 4px; }
  .nav-menu a { display: flex; align-items: center; gap: 12px; padding: 12px 16px; color: #A0A0B0; text-decoration: none; border-radius: 8px; font-size: 15px; transition: 0.2s; }
  .nav-menu a:hover { background: #1f1f23; color: #fff; }
  .nav-menu a.active { background: rgba(108, 92, 231, 0.15); color: #6C5CE7; border: 1px solid rgba(108, 92, 231, 0.3); }
  .btn-logout { padding: 12px 16px; color: #A0A0B0; text-decoration: none; border-radius: 8px; font-size: 15px; border: 1px solid #27272a; text-align: center; transition: 0.2s; cursor: pointer; }
  .btn-logout:hover { border-color: #6C5CE7; color: #fff; }
  
  .main { padding: 32px 48px; }
  .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; padding-bottom: 24px; border-bottom: 1px solid #27272a; }
  .header h1 { font-size: 28px; font-weight: 700; font-family: 'Manrope'; }
  .balance-badge { background: rgba(108, 92, 231, 0.15); color: #6C5CE7; padding: 10px 20px; border-radius: 100px; font-size: 14px; font-weight: 500; border: 1px solid rgba(108, 92, 231, 0.3); }
  
  .create-card { background: #141414; border: 1px solid #27272a; border-radius: 16px; padding: 32px; margin-bottom: 24px; }
  .create-card h2 { font-size: 22px; font-weight: 700; margin-bottom: 24px; font-family: 'Manrope'; }
  .upload-zone { border: 2px dashed #6C5CE7; border-radius: 12px; padding: 48px 24px; text-align: center; margin-bottom: 24px; background: rgba(108, 92, 231, 0.05); cursor: pointer; transition: 0.2s; }
  .upload-zone:hover { background: rgba(108, 92, 231, 0.1); border-color: #A29BFE; }
  .upload-icon { font-size: 48px; margin-bottom: 12px; }
  .upload-text { color: #A0A0B0; font-size: 15px; }
  .upload-text strong { color: #fff; }
  .form-group { margin-bottom: 20px; }
  .form-group label { display: block; font-size: 14px; color: #A0A0B0; margin-bottom: 8px; font-weight: 500; }
  .form-group input, .form-group textarea, .form-group select { width: 100%; background: #0A0A0F; border: 1px solid #27272a; border-radius: 8px; padding: 12px 16px; color: #fff; font-size: 15px; font-family: inherit; }
  .form-group input:focus, .form-group textarea:focus, .form-group select:focus { outline: none; border-color: #6C5CE7; }
  .form-group textarea { resize: vertical; min-height: 80px; }
  
  .prompt-row { display: flex; gap: 12px; align-items: flex-start; }
  .prompt-row textarea { flex: 1; }
  .btn-prompt { background: transparent; border: 1px solid #6C5CE7; color: #6C5CE7; padding: 12px 20px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; transition: 0.2s; white-space: nowrap; }
  .btn-prompt:hover { background: #6C5CE7; color: #fff; }
  .btn-prompt:disabled { opacity: 0.5; cursor: not-allowed; }
  
  .btn-generate { width: 100%; background: linear-gradient(135deg, #6C5CE7, #A29BFE); color: #fff; padding: 16px; border-radius: 12px; border: none; font-size: 16px; font-weight: 600; cursor: pointer; transition: 0.2s; box-shadow: 0 10px 30px rgba(108, 92, 231, 0.4); }
  .btn-generate:hover { transform: translateY(-2px); box-shadow: 0 15px 40px rgba(108, 92, 231, 0.6); }
  .btn-generate:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
  
  @media (max-width: 768px) {
    .layout { grid-template-columns: 1fr; }
    .sidebar { display: none; }
    .main { padding: 20px; }
    .prompt-row { flex-direction: column; }
  }
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <a href="index.html" class="sidebar-logo">Cliply</a>
    <ul class="nav-menu" id="navMenu">
      <li><a href="dashboard.html" class="active">📊 Дашборд</a></li>
      <li><a href="pricing.html">💎 Тарифы</a></li>
      <li><a href="settings.html">️ Настройки</a></li>
    </ul>
    <div class="btn-logout" onclick="logout()">Выйти</div>
  </aside>
  
  <main class="main">
    <div class="header">
      <h1 id="welcomeText">Добро пожаловать!</h1>
      <div class="balance-badge" id="roleBadge">Загрузка...</div>
    </div>

    <div class="create-card">
      <h2>Создать новое видео</h2>
      
      <div class="upload-zone" onclick="document.getElementById('fileInput').click()">
        <div class="upload-icon">📸</div>
        <div class="upload-text"><strong>Перетащите фото товара сюда</strong><br>или нажмите, чтобы выбрать (3-5 фото)</div>
        <input type="file" id="fileInput" multiple accept="image/*" style="display: none;">
      </div>
      
      <div class="form-group">
        <label>Описание товара и ключевые преимущества</label>
        <div class="prompt-row">
          <textarea id="productDescription" placeholder="Например: Бутылка для воды 1л, экологичный пластик, не протекает, удобная крышка..."></textarea>
          <button class="btn-prompt" onclick="generatePrompt()" id="btnGeneratePrompt">✨ Улучшить промпт</button>
        </div>
      </div>
      
      <div class="form-group">
        <label>Выберите сценарий</label>
        <select id="scenarioSelect">
          <option>Обзор товара</option>
          <option>3 причины купить</option>
          <option>Проблема → Решение</option>
          <option>Распаковка</option>
          <option>Отзыв покупателя</option>
          <option>Сравнение с аналогами</option>
        </select>
      </div>
      
      <button class="btn-generate" onclick="startGeneration()">Сгенерировать видео →</button>
    </div>
  </main>
</div>

<script>
async function initDashboard() {
  const user = await requireAuth();
  if (!user) return;
  
  document.getElementById('welcomeText').textContent = `Добро пожаловать, ${user.profile.full_name || 'Селлер'}!`;
  const role = ROLES[user.profile.role_level];
  const badge = document.getElementById('roleBadge');
  badge.textContent = `${role.name} • ${user.email}`;
  badge.style.color = role.color;
  badge.style.borderColor = role.color + '4D';
  badge.style.background = role.color + '26';

  if (user.profile.role_level <= 2) {
    const menu = document.getElementById('navMenu');
    const adminLink = document.createElement('li');
    adminLink.innerHTML = '<a href="admin.html">👑 Админ-панель</a>';
    menu.insertBefore(adminLink, menu.children[1]);
  }
}

async function generatePrompt() {
  const textarea = document.getElementById('productDescription');
  const btn = document.getElementById('btnGeneratePrompt');
  const originalText = textarea.value.trim();
  
  if (!originalText) {
    alert('Сначала введите описание товара');
    return;
  }
  
  btn.disabled = true;
  btn.textContent = '⏳ Генерация...';
  
  await new Promise(resolve => setTimeout(resolve, 2000));
  
  const enhancedPrompt = `${originalText}

[AI-улучшенная версия]:
Создай динамичное вертикальное видео (9:16) длительностью 15 секунд для маркетплейса. 

Ключевые акценты:
• Покажи товар с разных ракурсов (крупный план, в использовании)
• Подчеркни главные преимущества через текст на экране
• Используй современный минималистичный стиль
• Добавь энергичную фоновую музыку
• Заверши призывом к действию "Закажи сейчас"

Целевая аудитория: покупатели маркетплейсов, ищущие качественный товар по доступной цене.`;
  
  textarea.value = enhancedPrompt;
  btn.disabled = false;
  btn.textContent = '✨ Улучшить промпт';
}

function startGeneration() {
  const btn = document.querySelector('.btn-generate');
  const description = document.getElementById('productDescription').value.trim();
  
  if (!description) {
    alert('Введите описание товара');
    return;
  }
  
  btn.textContent = '⏳ Генерация...';
  btn.disabled = true;
  
  setTimeout(() => {
    btn.textContent = '✅ Видео готово!';
    alert('Видео успешно сгенерировано! (Демо-режим)');
    setTimeout(() => {
      btn.textContent = 'Сгенерировать видео →';
      btn.disabled = false;
    }, 2000);
  }, 3000);
}

initDashboard();
</script>
</body>
</html>
