<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Cliply — Личный кабинет</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth.js"></script>
<link rel="stylesheet" href="toast.css">
<script src="toast.js"></script>
<link rel="stylesheet" href="skeleton.css">
<script src="skeleton.js"></script>
<link rel="stylesheet" href="transitions.css">
<link rel="stylesheet" href="scrollbar.css">
<link rel="stylesheet" href="micro-animations.css">
<script src="transitions.js"></script>
<script src="micro-animations.js"></script>
<script src="draft.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; background: #0A0A0F; color: #fff; min-height: 100vh; }
  .layout { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }
  .sidebar { background: #141414; border-right: 1px solid #27272a; padding: 24px 16px; display: flex; flex-direction: column; }
  .sidebar-logo { font-weight: 800; font-size: 22px; font-family: 'Manrope'; background: linear-gradient(135deg, #6C5CE7, #A29BFE); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-decoration: none; margin-bottom: 40px; display: block; }
  .nav-menu { list-style: none; flex: 1; }
  .nav-menu li { margin-bottom: 4px; }
  .nav-menu a { display: flex; align-items: center; gap: 12px; padding: 12px 16px; color: #A0A0B0; text-decoration: none; border-radius: 8px; font-size: 15px; transition: 0.2s; }
  .nav-menu a:hover { background: #1f1f23; color: #fff; }
  .nav-menu a.active { background: rgba(108, 92, 231, 0.15); color: #6C5CE7; border: 1px solid rgba(108, 92, 231, 0.3); }
  .btn-logout { padding: 12px 16px; color: #A0A0B0; text-decoration: none; border-radius: 8px; font-size: 15px; border: 1px solid #27272a; text-align: center; transition: 0.2s; cursor: pointer; }
  .btn-logout:hover { border-color: #6C5CE7; color: #fff; }
  .main { padding: 32px 48px; }
  .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; padding-bottom: 24px; border-bottom: 1px solid #27272a; }
  .header h1 { font-size: 28px; font-weight: 700; font-family: 'Manrope'; }
  .balance-badge { background: rgba(108, 92, 231, 0.15); color: #6C5CE7; padding: 10px 20px; border-radius: 100px; font-size: 14px; font-weight: 500; border: 1px solid rgba(108, 92, 231, 0.3); }
  .create-card { background: #141414; border: 1px solid #27272a; border-radius: 16px; padding: 32px; margin-bottom: 40px; }
  .create-card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
  .create-card h2 { font-size: 22px; font-weight: 700; font-family: 'Manrope'; }
  .upload-zone { border: 2px dashed #6C5CE7; border-radius: 12px; padding: 48px 24px; text-align: center; margin-bottom: 24px; background: rgba(108, 92, 231, 0.05); cursor: pointer; transition: all 0.3s ease; position: relative; overflow: hidden; }
  .upload-zone:hover { background: rgba(108, 92, 231, 0.1); border-color: #A29BFE; }
  .upload-zone.drag-over { background: rgba(108, 92, 231, 0.2); border-color: #A29BFE; border-style: solid; transform: scale(1.01); box-shadow: 0 0 40px rgba(108, 92, 231, 0.3); }
  .upload-zone.drag-over .upload-icon { animation: bounce 0.6s ease infinite; }
  .upload-zone.uploading { border-color: #f59e0b; background: rgba(245, 158, 11, 0.05); }
  .upload-zone.uploading .upload-icon { animation: pulse 1s ease infinite; }
  .upload-zone.success { border-color: #10b981; background: rgba(16, 185, 129, 0.05); border-style: solid; }
  
  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }
  
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.7; transform: scale(1.1); }
  }
  
  .upload-icon { font-size: 48px; margin-bottom: 12px; transition: transform 0.3s; }
  .upload-text { color: #A0A0B0; font-size: 15px; }
  .upload-text strong { color: #fff; }
  .upload-hint { color: #6C5CE7; font-size: 13px; margin-top: 8px; }
  
  .upload-progress {
    width: 100%;
    height: 6px;
    background: #27272a;
    border-radius: 3px;
    margin-top: 20px;
    overflow: hidden;
    display: none;
  }
  
  .upload-progress.active {
    display: block;
  }
  
  .upload-progress-bar {
    height: 100%;
    background: linear-gradient(90deg, #6C5CE7, #A29BFE);
    border-radius: 3px;
    transition: width 0.3s ease;
    width: 0%;
  }
  
  .upload-progress-text {
    text-align: center;
    font-size: 13px;
    color: #A0A0B0;
    margin-top: 8px;
    display: none;
  }
  
  .upload-progress-text.active {
    display: block;
  }
  
  .photo-preview-container {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
    gap: 12px;
    margin-bottom: 24px;
  }
  
  .photo-preview {
    position: relative;
    aspect-ratio: 1;
    border-radius: 8px;
    overflow: hidden;
    border: 2px solid #27272a;
    transition: all 0.3s ease;
    animation: photoAppear 0.4s ease-out;
  }
  
  @keyframes photoAppear {
    from {
      opacity: 0;
      transform: scale(0.8);
    }
    to {
      opacity: 1;
      transform: scale(1);
    }
  }
  
  .photo-preview:hover {
    border-color: #6C5CE7;
    transform: translateY(-2px);
  }
  
  .photo-preview img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  
  .photo-info {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    background: linear-gradient(transparent, rgba(0,0,0,0.8));
    padding: 20px 6px 6px;
    font-size: 11px;
    color: #fff;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  
  .photo-remove {
    position: absolute;
    top: 6px;
    right: 6px;
    width: 22px;
    height: 22px;
    background: rgba(239, 68, 68, 0.95);
    border: none;
    border-radius: 50%;
    color: #fff;
    font-size: 14px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    line-height: 1;
    opacity: 0;
    transform: scale(0.8);
  }
  
  .photo-preview:hover .photo-remove {
    opacity: 1;
    transform: scale(1);
  }
  
  .photo-remove:hover {
    background: #ef4444;
    transform: scale(1.15) !important;
  }
  
  .photo-counter {
    text-align: center;
    color: #A0A0B0;
    font-size: 14px;
    margin-bottom: 16px;
    padding: 10px;
    background: rgba(108, 92, 231, 0.05);
    border-radius: 8px;
    border: 1px solid rgba(108, 92, 231, 0.2);
  }
  
  .photo-counter strong {
    color: #6C5CE7;
  }
  
  .form-group { margin-bottom: 20px; }
  .form-group label { display: block; font-size: 14px; color: #A0A0B0; margin-bottom: 8px; font-weight: 500; }
  .form-group input, .form-group textarea, .form-group select { width: 100%; background: #0A0A0F; border: 1px solid #27272a; border-radius: 8px; padding: 12px 16px; color: #fff; font-size: 15px; font-family: inherit; }
  .form-group input:focus, .form-group textarea:focus, .form-group select:focus { outline: none; border-color: #6C5CE7; }
  .form-group textarea { resize: vertical; min-height: 80px; }
  .prompt-row { display: flex; gap: 12px; align-items: flex-start; }
  .prompt-row textarea { flex: 1; }
  .btn-prompt { background: transparent; border: 1px solid #6C5CE7; color: #6C5CE7; padding: 12px 20px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; transition: 0.2s; white-space: nowrap; }
  .btn-prompt:hover { background: #6C5CE7; color: #fff; }
  .btn-prompt:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-generate { width: 100%; background: linear-gradient(135deg, #6C5CE7, #A29BFE); color: #fff; padding: 16px; border-radius: 12px; border: none; font-size: 16px; font-weight: 600; cursor: pointer; transition: 0.2s; box-shadow: 0 10px 30px rgba(108, 92, 231, 0.4); }
  .btn-generate:hover { transform: translateY(-2px); box-shadow: 0 15px 40px rgba(108, 92, 231, 0.6); }
  .btn-generate:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
  .projects-section h2 { font-size: 22px; font-weight: 700; margin-bottom: 24px; font-family: 'Manrope'; }
  .projects-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
  .project-card { background: #141414; border: 1px solid #27272a; border-radius: 12px; overflow: hidden; transition: 0.2s; }
  .project-card:hover { border-color: #6C5CE7; transform: translateY(-2px); }
  .project-preview { height: 160px; background: linear-gradient(135deg, #1a1a2e, #16213e); display: flex; align-items: center; justify-content: center; font-size: 48px; position: relative; }
  .project-status { position: absolute; top: 12px; right: 12px; padding: 4px 10px; border-radius: 100px; font-size: 12px; font-weight: 600; }
  .status-done { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
  .status-progress { background: rgba(234, 179, 8, 0.2); color: #facc15; border: 1px solid rgba(234, 179, 8, 0.3); }
  .project-info { padding: 16px; }
  .project-title { font-size: 15px; font-weight: 600; margin-bottom: 12px; }
  .project-actions { display: flex; gap: 8px; }
  .btn-small { flex: 1; padding: 8px; border-radius: 6px; border: 1px solid #27272a; background: transparent; color: #A0A0B0; font-size: 13px; cursor: pointer; transition: 0.2s; }
  .btn-small:hover { border-color: #6C5CE7; color: #fff; }
  .btn-small.primary { background: #6C5CE7; border-color: #6C5CE7; color: #fff; }
  
  /* Индикатор автосохранения */
  .draft-indicator {
    font-size: 13px;
    color: #A0A0B0;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: all 0.3s ease;
  }
  
  .draft-indicator.draft-saving {
    color: #f59e0b;
  }
  
  .draft-indicator.draft-saved {
    color: #10b981;
  }
  
  .draft-indicator.draft-error {
    color: #ef4444;
  }
  
  .draft-indicator::before {
    content: '';
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: currentColor;
    display: inline-block;
  }
  
  .draft-indicator.draft-saving::before {
    animation: draftPulse 1s ease infinite;
  }
  
  @keyframes draftPulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }
  
  .btn-clear-draft {
    background: transparent;
    border: 1px solid #27272a;
    color: #A0A0B0;
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.2s;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  
  .btn-clear-draft:hover {
    border-color: #ef4444;
    color: #ef4444;
  }
  
  @media (max-width: 768px) {
    .layout { grid-template-columns: 1fr; }
    .sidebar { display: none; }
    .main { padding: 20px; }
    .prompt-row { flex-direction: column; }
    .photo-preview-container { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); }
    .create-card-header { flex-direction: column; align-items: flex-start; gap: 8px; }
  }
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <a href="index.html" class="sidebar-logo">Cliply</a>
    <ul class="nav-menu" id="navMenu">
      <li><a href="dashboard.html" class="active">📊 Дашборд</a></li>
      <li><a href="pricing.html">💎 Тарифы</a></li>
      <li><a href="settings.html">⚙️ Настройки</a></li>
    </ul>
    <div class="btn-logout" onclick="logout()">Выйти</div>
  </aside>
  <main class="main">
    <div class="header">
      <h1 id="welcomeText" class="skeleton skeleton-title">Загрузка...</h1>
      <div class="balance-badge skeleton skeleton-badge" id="roleBadge">Загрузка...</div>
    </div>
    <div class="create-card">
      <div class="create-card-header">
        <h2>Создать новое видео</h2>
        <div style="display: flex; gap: 12px; align-items: center;">
          <span id="draftIndicator" class="draft-indicator"></span>
          <button id="clearDraftBtn" class="btn-clear-draft" style="display: none;">🗑 Очистить черновик</button>
        </div>
      </div>
      <div class="upload-zone" id="uploadZone">
        <div class="upload-icon">📸</div>
        <div class="upload-text"><strong>Перетащите фото товара сюда</strong><br>или нажмите, чтобы выбрать</div>
        <div class="upload-hint">3-5 фото • JPG, PNG, WebP • до 10 МБ каждое</div>
        <div class="upload-progress" id="uploadProgress">
          <div class="upload-progress-bar" id="uploadProgressBar"></div>
        </div>
        <div class="upload-progress-text" id="uploadProgressText">Загрузка...</div>
        <input type="file" id="fileInput" multiple accept="image/jpeg,image/png,image/webp" style="display: none;">
      </div>
      <div id="photoCounter" class="photo-counter" style="display: none;">Выбрано фото: <strong id="photoCount">0</strong> из 5 • Общий размер: <strong id="photoSize">0 МБ</strong></div>
      <div id="photoPreviewContainer" class="photo-preview-container"></div>
      <div class="form-group">
        <label>Описание товара и ключевые преимущества</label>
        <div class="prompt-row">
          <textarea id="productDescription" placeholder="Например: Бутылка для воды 1л, экологичный пластик, не протекает, удобная крышка..."></textarea>
          <button class="btn-prompt" onclick="generatePrompt()" id="btnGeneratePrompt">✨ Улучшить промпт</button>
        </div>
      </div>
      <div class="form-group">
        <label>Выберите сценарий</label>
        <select id="scenarioSelect">
          <option>Обзор товара</option>
          <option>3 причины купить</option>
          <option>Проблема → Решение</option>
          <option>Распаковка</option>
          <option>Отзыв покупателя</option>
          <option>Сравнение с аналогами</option>
        </select>
      </div>
      <button class="btn-generate" onclick="startGeneration()" id="btnGenerate">Сгенерировать видео →</button>
    </div>
    <div class="projects-section">
      <h2>Ваши видео</h2>
      <div class="projects-grid" id="projectsGrid">
      </div>
    </div>
  </main>
</div>
<script>
let uploadedPhotos = [];
let draftManager = null;

async function initDashboard() {
  showVideoCardSkeleton('#projectsGrid', 4);
  
  const user = await requireAuth();
  if (!user) return;
  
  await new Promise(resolve => setTimeout(resolve, 800));
  
  document.getElementById('welcomeText').classList.remove('skeleton', 'skeleton-title');
  document.getElementById('welcomeText').textContent = `Добро пожаловать, ${user.profile.full_name || 'Селлер'}!`;
  showContentWithAnimation('#welcomeText');
  
  document.getElementById('roleBadge').classList.remove('skeleton', 'skeleton-badge');
  const role = ROLES[user.profile.role_level];
  const badge = document.getElementById('roleBadge');
  badge.textContent = `${role.name} • ${user.email}`;
  badge.style.color = role.color;
  badge.style.borderColor = role.color + '4D';
  badge.style.background = role.color + '26';
  showContentWithAnimation('#roleBadge');
  
  if (user.profile.role_level <= 2) {
    const menu = document.getElementById('navMenu');
    const adminLink = document.createElement('li');
    adminLink.innerHTML = '<a href="admin.html">👑 Админ-панель</a>';
    menu.insertBefore(adminLink, menu.children[1]);
  }
  
  // Инициализируем менеджер черновиков
  draftManager = new DraftManager({
    userId: user.id,
    descriptionSelector: '#productDescription',
    scenarioSelector: '#scenarioSelect',
    indicatorSelector: '#draftIndicator',
    clearButtonSelector: '#clearDraftBtn',
    debounceMs: 500
  });
  draftManager.init();
  
  await new Promise(resolve => setTimeout(resolve, 500));
  loadRealVideos();
  
  if (window.microAnimations) {
    window.microAnimations.initRipple();
  }
}

function loadRealVideos() {
  const grid = document.getElementById('projectsGrid');
  grid.innerHTML = `
    <div class="project-card content-fade-in">
      <div class="project-preview">🎬<span class="project-status status-done">Готово</span></div>
      <div class="project-info">
        <div class="project-title">Бутылка для воды 1л</div>
        <div class="project-actions">
          <button class="btn-small primary">Скачать</button>
          <button class="btn-small">Перегенерировать</button>
        </div>
      </div>
    </div>
    <div class="project-card content-fade-in">
      <div class="project-preview">🎬<span class="project-status status-done">Готово</span></div>
      <div class="project-info">
        <div class="project-title">Крем для лица увлажняющий</div>
        <div class="project-actions">
          <button class="btn-small primary">Скачать</button>
          <button class="btn-small">Перегенерировать</button>
        </div>
      </div>
    </div>
    <div class="project-card content-fade-in">
      <div class="project-preview">🎬<span class="project-status status-done">Готово</span></div>
      <div class="project-info">
        <div class="project-title">Рюкзак городской</div>
        <div class="project-actions">
          <button class="btn-small primary">Скачать</button>
          <button class="btn-small">Перегенерировать</button>
        </div>
      </div>
    </div>
    <div class="project-card content-fade-in">
      <div class="project-preview"><span class="project-status status-progress">В процессе</span></div>
      <div class="project-info">
        <div class="project-title">Наушники беспроводные</div>
        <div class="project-actions">
          <button class="btn-small" disabled>Ожидание...</button>
        </div>
      </div>
    </div>
  `;
}

const uploadZone = document.getElementById('uploadZone');
const fileInput = document.getElementById('fileInput');
const uploadProgress = document.getElementById('uploadProgress');
const uploadProgressBar = document.getElementById('uploadProgressBar');
const uploadProgressText = document.getElementById('uploadProgressText');

uploadZone.addEventListener('click', (e) => {
  if (e.target.closest('.photo-remove')) return;
  fileInput.click();
});

uploadZone.addEventListener('dragover', (e) => {
  e.preventDefault();
  uploadZone.classList.add('drag-over');
});

uploadZone.addEventListener('dragleave', (e) => {
  e.preventDefault();
  if (!uploadZone.contains(e.relatedTarget)) {
    uploadZone.classList.remove('drag-over');
  }
});

uploadZone.addEventListener('drop', (e) => {
  e.preventDefault();
  uploadZone.classList.remove('drag-over');
  const files = Array.from(e.dataTransfer.files);
  handleFiles(files);
});

fileInput.addEventListener('change', (e) => {
  const files = Array.from(e.target.files);
  handleFiles(files);
  fileInput.value = '';
});

function formatFileSize(bytes) {
  if (bytes < 1024) return bytes + ' Б';
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' КБ';
  return (bytes / (1024 * 1024)).toFixed(2) + ' МБ';
}

function getTotalSize() {
  return uploadedPhotos.reduce((sum, f) => sum + f.size, 0);
}

async function handleFiles(files) {
  const validTypes = ['image/jpeg', 'image/png', 'image/webp'];
  const maxSize = 10 * 1024 * 1024;
  const filesToAdd = [];
  
  for (const file of files) {
    if (uploadedPhotos.length + filesToAdd.length >= 5) {
      showToast('Максимум 5 фото', 'warning');
      break;
    }
    if (!validTypes.includes(file.type)) {
      showToast(`${file.name}: неподдерживаемый формат`, 'error');
      continue;
    }
    if (file.size > maxSize) {
      showToast(`${file.name}: файл больше 10 МБ`, 'error');
      continue;
    }
    filesToAdd.push(file);
  }
  
  if (filesToAdd.length === 0) return;
  
  uploadZone.classList.add('uploading');
  uploadProgress.classList.add('active');
  uploadProgressText.classList.add('active');
  uploadProgressText.textContent = 'Загрузка фото...';
  
  for (let i = 0; i < filesToAdd.length; i++) {
    const progress = ((uploadedPhotos.length + i + 1) / 5) * 100;
    uploadProgressBar.style.width = progress + '%';
    uploadProgressText.textContent = `Загрузка ${i + 1} из ${filesToAdd.length}...`;
    await new Promise(resolve => setTimeout(resolve, 400));
    uploadedPhotos.push(filesToAdd[i]);
  }
  
  uploadZone.classList.remove('uploading');
  uploadZone.classList.add('success');
  uploadProgressText.textContent = '✓ Фото загружены';
  
  setTimeout(() => {
    uploadProgress.classList.remove('active');
    uploadProgressText.classList.remove('active');
    uploadProgressBar.style.width = '0%';
    uploadZone.classList.remove('success');
  }, 1500);
  
  updatePhotoPreview();
  showToast(`Загружено фото: ${filesToAdd.length}`, 'success');
}

function updatePhotoPreview() {
  const container = document.getElementById('photoPreviewContainer');
  const counter = document.getElementById('photoCounter');
  const count = document.getElementById('photoCount');
  const size = document.getElementById('photoSize');
  
  if (uploadedPhotos.length === 0) {
    counter.style.display = 'none';
    container.innerHTML = '';
    return;
  }
  
  counter.style.display = 'block';
  count.textContent = uploadedPhotos.length;
  size.textContent = formatFileSize(getTotalSize());
  
  container.innerHTML = '';
  uploadedPhotos.forEach((photo, index) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const div = document.createElement('div');
      div.className = 'photo-preview';
      div.innerHTML = `
        <img src="${e.target.result}" alt="${photo.name}">
        <div class="photo-info">${photo.name}</div>
        <button class="photo-remove" onclick="removePhoto(${index})" title="Удалить">×</button>
      `;
      container.appendChild(div);
    };
    reader.readAsDataURL(photo);
  });
}

function removePhoto(index) {
  const name = uploadedPhotos[index].name;
  uploadedPhotos.splice(index, 1);
  updatePhotoPreview();
  showToast(`Фото "${name}" удалено`, 'info');
}

async function generatePrompt() {
  const textarea = document.getElementById('productDescription');
  const btn = document.getElementById('btnGeneratePrompt');
  const originalText = textarea.value.trim();
  if (!originalText) { showToast('Сначала введите описание товара', 'warning'); return; }
  btn.disabled = true;
  btn.textContent = '⏳ Генерация...';
  await new Promise(resolve => setTimeout(resolve, 2000));
  const enhancedPrompt = `${originalText}

[AI-улучшенная версия]:
Создай динамичное вертикальное видео (9:16) длительностью 15 секунд для маркетплейса.

Ключевые акценты:
• Покажи товар с разных ракурсов (крупный план, в использовании)
• Подчеркни главные преимущества через текст на экране
• Используй современный минималистичный стиль
• Добавь энергичную фоновую музыку
• Заверши призывом к действию "Закажи сейчас"

Целевая аудитория: покупатели маркетплейсов, ищущие качественный товар по доступной цене.`;
  textarea.value = enhancedPrompt;
  btn.disabled = false;
  btn.textContent = '✨ Улучшить промпт';
  
  // Сохраняем улучшенный промпт в черновик
  if (draftManager) draftManager.save();
}

function startGeneration() {
  const btn = document.getElementById('btnGenerate');
  const description = document.getElementById('productDescription').value.trim();
  
  if (uploadedPhotos.length < 3) {
    showToast('Загрузите минимум 3 фото товара', 'warning');
    return;
  }
  
  if (!description) {
    showToast('Введите описание товара', 'warning');
    return;
  }
  
  btn.textContent = '⏳ Генерация...';
  btn.disabled = true;
  
  setTimeout(() => {
    btn.textContent = '✅ Видео готово!';
    showToast('Видео успешно сгенерировано! (Демо-режим)', 'success');
    
    // Очищаем черновик после успешной генерации
    if (draftManager) draftManager.clear();
    
    setTimeout(() => {
      btn.textContent = 'Сгенерировать видео →';
      btn.disabled = false;
    }, 2000);
  }, 3000);
}

initDashboard();
</script>
