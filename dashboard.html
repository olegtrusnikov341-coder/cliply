<html lang="ru">

<head>
<meta charset="UTF-8">
<title>Личный кабинет Cliply — создание видео</title>
<meta name="description" content="Создавайте продающие видео для маркетплейсов с помощью AI. Загрузите фото, опишите товар — получите готовое видео.">
<meta name="robots" content="noindex, nofollow">

<meta name="theme-color" content="#6C5CE7">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cliply">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="favicon.svg">

<link rel="preconnect" href="https://djvdklcahpqbjotukmxt.supabase.co">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth.js"></script>
<link rel="stylesheet" href="toast.css">
<script src="toast.js"></script>
<link rel="stylesheet" href="skeleton.css">
<script src="skeleton.js"></script>
<link rel="stylesheet" href="transitions.css">
<link rel="stylesheet" href="scrollbar.css">
<link rel="stylesheet" href="micro-animations.css">
<script src="transitions.js"></script>
<script src="micro-animations.js"></script>
<script src="draft.js"></script>
<style>
  /* ... твой существующий <style> без изменений ... */
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <a href="index.html" class="sidebar-logo">Cliply</a>
    <ul class="nav-menu" id="navMenu">
      <li><a href="dashboard.html" class="active">📊 Дашборд</a></li>
      <li><a href="pricing.html">💎 Тарифы</a></li>
      <li><a href="settings.html">️ Настройки</a></li>
    </ul>
    <div class="btn-logout" onclick="logout()">Выйти</div>
  </aside>
  <main class="main">
    <div class="header">
      <h1 id="welcomeText" class="skeleton skeleton-title">Загрузка...</h1>
      <div class="balance-badge skeleton skeleton-badge" id="roleBadge">Загрузка...</div>
    </div>
    <div class="create-card">
      <div class="create-card-header">
        <h2>Создать новое видео</h2>
        <div style="display: flex; gap: 12px; align-items: center;">
          <span id="draftIndicator" class="draft-indicator"></span>
          <button id="clearDraftBtn" class="btn-clear-draft" style="display: none;">🗑 Очистить черновик</button>
        </div>
      </div>
      <div class="upload-zone" id="uploadZone">
        <div class="upload-icon">📸</div>
        <div class="upload-text"><strong>Перетащите фото товара сюда</strong><br>или нажмите, чтобы выбрать</div>
        <div class="upload-hint">3-5 фото • JPG, PNG, WebP • до 10 МБ каждое</div>
        <div class="upload-progress" id="uploadProgress">
          <div class="upload-progress-bar" id="uploadProgressBar"></div>
        </div>
        <div class="upload-progress-text" id="uploadProgressText">Загрузка...</div>
        <input type="file" id="fileInput" multiple accept="image/jpeg,image/png,image/webp" style="display: none;">
      </div>
      <div id="photoCounter" class="photo-counter" style="display: none;">Выбрано фото: <strong id="photoCount">0</strong> из 5 • Общий размер: <strong id="photoSize">0 МБ</strong></div>
      <div id="photoPreviewContainer" class="photo-preview-container"></div>
      <div id="validationErrors" class="validation-errors">
        <ul id="validationErrorsList"></ul>
      </div>
      <div class="form-group">
        <label>Описание товара и ключевые преимущества</label>
        <div class="prompt-row">
          <textarea id="productDescription" placeholder="Например: Бутылка для воды 1л, экологичный пластик, не протекает, удобная крышка..."></textarea>
          <button class="btn-prompt" onclick="generatePrompt()" id="btnGeneratePrompt">✨ Улучшить промпт</button>
        </div>
      </div>
      <div class="form-group">
        <label>Выберите сценарий</label>
        <select id="scenarioSelect">
          <option>Обзор товара</option>
          <option>3 причины купить</option>
          <option>Проблема → Решение</option>
          <option>Распаковка</option>
          <option>Отзыв покупателя</option>
          <option>Сравнение с аналогами</option>
        </select>
      </div>
      <button class="btn-generate" onclick="startGeneration()" id="btnGenerate">Сгенерировать видео →</button>
    </div>
    
    <div class="videos-section">
      <div class="videos-section-header">
        <h2>Ваши видео</h2>
        <div class="videos-controls">
          <input type="text" id="searchInput" class="search-input" placeholder="🔍 Поиск по названию...">
          <select id="statusFilter" class="filter-select">
            <option value="all">Все статусы</option>
            <option value="done">Готово</option>
            <option value="processing">В процессе</option>
            <option value="failed">Ошибка</option>
          </select>
        </div>
      </div>
      <div class="projects-grid" id="projectsGrid">
      </div>
    </div>
  </main>
</div>
<script>
let uploadedPhotos = [];
let draftManager = null;
let currentUser = null;
let allVideos = [];

async function initDashboard() {
  showVideoCardSkeleton('#projectsGrid', 4);
  
  currentUser = await requireAuth();
  if (!currentUser) return;
  
  await new Promise(resolve => setTimeout(resolve, 800));
  
  document.getElementById('welcomeText').classList.remove('skeleton', 'skeleton-title');
  document.getElementById('welcomeText').textContent = `Добро пожаловать, ${currentUser.profile.full_name || 'Селлер'}!`;
  showContentWithAnimation('#welcomeText');
  
  document.getElementById('roleBadge').classList.remove('skeleton', 'skeleton-badge');
  const role = ROLES[currentUser.profile.role_level];
  const badge = document.getElementById('roleBadge');
  badge.textContent = `${role.name} • ${currentUser.email}`;
  badge.style.color = role.color;
  badge.style.borderColor = role.color + '4D';
  badge.style.background = role.color + '26';
  showContentWithAnimation('#roleBadge');
  
  if (currentUser.profile.role_level <= 2) {
    const menu = document.getElementById('navMenu');
    const adminLink = document.createElement('li');
    adminLink.innerHTML = '<a href="admin.html">👑 Админ-панель</a>';
    menu.insertBefore(adminLink, menu.children[1]);
  }
  
  draftManager = new DraftManager({
    userId: currentUser.id,
    descriptionSelector: '#productDescription',
    scenarioSelector: '#scenarioSelect',
    indicatorSelector: '#draftIndicator',
    clearButtonSelector: '#clearDraftBtn',
    debounceMs: 500
  });
  draftManager.init();
  
  await loadVideos();
  
  if (window.microAnimations) {
    window.microAnimations.initRipple();
  }
}

async function loadVideos() {
  const { data, error } = await supabaseClient
    .from('videos')
    .select('*')
    .eq('user_id', currentUser.id)
    .order('created_at', { ascending: false });
  
  if (error) {
    showToast('Ошибка загрузки видео: ' + error.message, 'error');
    return;
  }
  
  allVideos = data || [];
  renderVideos();
}

function renderVideos() {
  const grid = document.getElementById('projectsGrid');
  const searchTerm = document.getElementById('searchInput').value.toLowerCase();
  const statusFilter = document.getElementById('statusFilter').value;
  
  let filteredVideos = allVideos.filter(video => {
    const matchesSearch = video.product_name.toLowerCase().includes(searchTerm) ||
                         video.product_description.toLowerCase().includes(searchTerm);
    const matchesStatus = statusFilter === 'all' || video.status === statusFilter;
    return matchesSearch && matchesStatus;
  });
  
  if (filteredVideos.length === 0) {
    grid.innerHTML = `
      <div class="empty-state" style="grid-column: 1 / -1;">
        <div class="empty-state-icon"></div>
        <div class="empty-state-text">${allVideos.length === 0 ? 'У вас ещё нет видео' : 'Ничего не найдено'}</div>
        <div class="empty-state-subtext">${allVideos.length === 0 ? 'Создайте первое видео выше' : 'Попробуйте изменить фильтры'}</div>
      </div>
    `;
    return;
  }
  
  grid.innerHTML = filteredVideos.map(video => {
    const statusClass = video.status === 'done' ? 'status-done' : 
                       video.status === 'processing' ? 'status-progress' : 'status-failed';
    const statusText = video.status === 'done' ? 'Готово' : 
                      video.status === 'processing' ? 'В процессе' : 'Ошибка';
    const date = new Date(video.created_at).toLocaleDateString('ru-RU', {
      day: '2-digit',
      month: '2-digit',
      year: 'numeric',
      hour: '2-digit',
      minute: '2-digit'
    });
    
    return `
      <div class="project-card content-fade-in">
        <div class="project-preview">
          ${video.status === 'done' ? '🎬' : video.status === 'processing' ? '⏳' : '❌'}
          <span class="project-status ${statusClass}">${statusText}</span>
        </div>
        <div class="project-info">
          <div class="project-title">${video.product_name || 'Без названия'}</div>
          <div class="project-date">${date}</div>
          <div class="project-actions">
            ${video.status === 'done' ? `
              <button class="btn-small primary" onclick="downloadVideo('${video.id}')">Скачать</button>
            ` : ''}
            <button class="btn-small" onclick="regenerateVideo('${video.id}')">Перегенерировать</button>
            <button class="btn-small danger" onclick="deleteVideo('${video.id}')">Удалить</button>
          </div>
        </div>
      </div>
    `;
  }).join('');
}

async function downloadVideo(videoId) {
  const video = allVideos.find(v => v.id === videoId);
  if (!video || !video.video_url) {
    showToast('Видео недоступно', 'error');
    return;
  }
  
  // Создаём ссылку для скачивания
  const link = document.createElement('a');
  link.href = video.video_url;
  link.download = `${video.product_name || 'video'}.mp4`;
  link.target = '_blank';
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  
  showToast('Скачивание началось', 'success');
}

async function regenerateVideo(videoId) {
  const video = allVideos.find(v => v.id === videoId);
  if (!video) return;
  
  showToast('Перегенерация начата (демо)', 'info');
  
  // В реальности здесь был бы вызов AI API
  setTimeout(() => {
    showToast('Видео перегенерировано (демо)', 'success');
  }, 3000);
}

async function deleteVideo(videoId) {
  if (!confirm('Удалить это видео? Это действие нельзя отменить.')) return;
  
  const { error } = await supabaseClient
    .from('videos')
    .delete()
    .eq('id', videoId);
  
  if (error) {
    showToast('Ошибка удаления: ' + error.message, 'error');
    return;
  }
  
  allVideos = allVideos.filter(v => v.id !== videoId);
  renderVideos();
  showToast('Видео удалено', 'success');
}

// Слушатели для поиска и фильтрации
document.getElementById('searchInput').addEventListener('input', renderVideos);
document.getElementById('statusFilter').addEventListener('change', renderVideos);

const uploadZone = document.getElementById('uploadZone');
const fileInput = document.getElementById('fileInput');
const uploadProgress = document.getElementById('uploadProgress');
const uploadProgressBar = document.getElementById('uploadProgressBar');
const uploadProgressText = document.getElementById('uploadProgressText');

uploadZone.addEventListener('click', (e) => {
  if (e.target.closest('.photo-remove')) return;
  fileInput.click();
});

uploadZone.addEventListener('dragover', (e) => {
  e.preventDefault();
  uploadZone.classList.add('drag-over');
});

uploadZone.addEventListener('dragleave', (e) => {
  e.preventDefault();
  if (!uploadZone.contains(e.relatedTarget)) {
    uploadZone.classList.remove('drag-over');
  }
});

uploadZone.addEventListener('drop', (e) => {
  e.preventDefault();
  uploadZone.classList.remove('drag-over');
  const files = Array.from(e.dataTransfer.files);
  handleFiles(files);
});

fileInput.addEventListener('change', (e) => {
  const files = Array.from(e.target.files);
  handleFiles(files);
  fileInput.value = '';
});

function formatFileSize(bytes) {
  if (bytes < 1024) return bytes + ' Б';
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' КБ';
  return (bytes / (1024 * 1024)).toFixed(2) + ' МБ';
}

function getTotalSize() {
  return uploadedPhotos.reduce((sum, f) => sum + f.size, 0);
}

async function handleFiles(files) {
  const validTypes = ['image/jpeg', 'image/png', 'image/webp'];
  const maxSize = 10 * 1024 * 1024;
  const errors = [];
  const filesToAdd = [];
  
  for (const file of files) {
    if (uploadedPhotos.length + filesToAdd.length >= 5) {
      errors.push(`${file.name}: максимум 5 фото`);
      continue;
    }
    if (!validTypes.includes(file.type)) {
      errors.push(`${file.name}: неподдерживаемый формат (только JPG, PNG, WebP)`);
      continue;
    }
    if (file.size > maxSize) {
      errors.push(`${file.name}: файл больше 10 МБ (${formatFileSize(file.size)})`);
      continue;
    }
    filesToAdd.push(file);
  }
  
  // Показываем ошибки валидации
  const errorsContainer = document.getElementById('validationErrors');
  const errorsList = document.getElementById('validationErrorsList');
  
  if (errors.length > 0) {
    errorsList.innerHTML = errors.map(e => `<li>${e}</li>`).join('');
    errorsContainer.classList.add('active');
    setTimeout(() => {
      errorsContainer.classList.remove('active');
    }, 5000);
  } else {
    errorsContainer.classList.remove('active');
  }
  
  if (filesToAdd.length === 0) return;
  
  uploadZone.classList.add('uploading');
  uploadProgress.classList.add('active');
  uploadProgressText.classList.add('active');
  uploadProgressText.textContent = 'Загрузка фото...';
  
  for (let i = 0; i < filesToAdd.length; i++) {
    const progress = ((uploadedPhotos.length + i + 1) / 5) * 100;
    uploadProgressBar.style.width = progress + '%';
    uploadProgressText.textContent = `Загрузка ${i + 1} из ${filesToAdd.length}...`;
    await new Promise(resolve => setTimeout(resolve, 400));
    uploadedPhotos.push(filesToAdd[i]);
  }
  
  uploadZone.classList.remove('uploading');
  uploadZone.classList.add('success');
  uploadProgressText.textContent = '✓ Фото загружены';
  
  setTimeout(() => {
    uploadProgress.classList.remove('active');
    uploadProgressText.classList.remove('active');
    uploadProgressBar.style.width = '0%';
    uploadZone.classList.remove('success');
  }, 1500);
  
  updatePhotoPreview();
  showToast(`Загружено фото: ${filesToAdd.length}`, 'success');
}

function updatePhotoPreview() {
  const container = document.getElementById('photoPreviewContainer');
  const counter = document.getElementById('photoCounter');
  const count = document.getElementById('photoCount');
  const size = document.getElementById('photoSize');
  
  if (uploadedPhotos.length === 0) {
    counter.style.display = 'none';
    container.innerHTML = '';
    return;
  }
  
  counter.style.display = 'block';
  count.textContent = uploadedPhotos.length;
  size.textContent = formatFileSize(getTotalSize());
  
  container.innerHTML = '';
  uploadedPhotos.forEach((photo, index) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const div = document.createElement('div');
      div.className = 'photo-preview';
      div.innerHTML = `
        <div class="photo-status-icon valid">✓</div>
        <img src="${e.target.result}" alt="${photo.name}">
        <div class="photo-info">${photo.name}</div>
        <button class="photo-remove" onclick="removePhoto(${index})" title="Удалить">×</button>
      `;
      container.appendChild(div);
    };
    reader.readAsDataURL(photo);
  });
}

function removePhoto(index) {
  const name = uploadedPhotos[index].name;
  uploadedPhotos.splice(index, 1);
  updatePhotoPreview();
  showToast(`Фото "${name}" удалено`, 'info');
}

async function generatePrompt() {
  const textarea = document.getElementById('productDescription');
  const btn = document.getElementById('btnGeneratePrompt');
  const originalText = textarea.value.trim();
  if (!originalText) { showToast('Сначала введите описание товара', 'warning'); return; }
  btn.disabled = true;
  btn.textContent = '⏳ Генерация...';
  await new Promise(resolve => setTimeout(resolve, 2000));
  const enhancedPrompt = `${originalText}

[AI-улучшенная версия]:
Создай динамичное вертикальное видео (9:16) длительностью 15 секунд для маркетплейса.

Ключевые акценты:
• Покажи товар с разных ракурсов (крупный план, в использовании)
• Подчеркни главные преимущества через текст на экране
• Используй современный минималистичный стиль
• Добавь энергичную фоновую музыку
• Заверши призывом к действию "Закажи сейчас"

Целевая аудитория: покупатели маркетплейсов, ищущие качественный товар по доступной цене.`;
  textarea.value = enhancedPrompt;
  btn.disabled = false;
  btn.textContent = '✨ Улучшить промпт';
  
  if (draftManager) draftManager.save();
}

async function startGeneration() {
  const btn = document.getElementById('btnGenerate');
  const description = document.getElementById('productDescription').value.trim();
  const scenario = document.getElementById('scenarioSelect').value;
  
  const errors = [];
  
  if (uploadedPhotos.length < 3) {
    errors.push('Загрузите минимум 3 фото товара');
  }
  
  if (!description) {
    errors.push('Введите описание товара');
  }
  
  if (errors.length > 0) {
    const errorsContainer = document.getElementById('validationErrors');
    const errorsList = document.getElementById('validationErrorsList');
    errorsList.innerHTML = errors.map(e => `<li>${e}</li>`).join('');
    errorsContainer.classList.add('active');
    setTimeout(() => {
      errorsContainer.classList.remove('active');
    }, 5000);
    return;
  }
  
  btn.textContent = '⏳ Генерация...';
  btn.disabled = true;
  
  // Создаём запись в БД
  const { data: video, error } = await supabaseClient
    .from('videos')
    .insert({
      user_id: currentUser.id,
      product_name: description.split(',')[0] || 'Новое видео',
      product_description: description,
      scenario: scenario,
      status: 'processing'
    })
    .select()
    .single();
  
  if (error) {
    showToast('Ошибка создания видео: ' + error.message, 'error');
    btn.textContent = 'Сгенерировать видео →';
    btn.disabled = false;
    return;
  }
  
  allVideos.unshift(video);
  renderVideos();
  
  // Имитация генерации
  setTimeout(async () => {
    const { error: updateError } = await supabaseClient
      .from('videos')
      .update({ status: 'done', video_url: 'https://example.com/video.mp4' })
      .eq('id', video.id);
    
    if (updateError) {
      showToast('Ошибка обновления статуса', 'error');
    } else {
      showToast('Видео успешно сгенерировано!', 'success');
      await loadVideos();
      
      // Очищаем черновик
      if (draftManager) draftManager.clear();
    }
    
    btn.textContent = 'Сгенерировать видео →';
    btn.disabled = false;
  }, 3000);
}

initDashboard();
</script>
</body>
</html>
