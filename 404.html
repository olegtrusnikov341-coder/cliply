<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<title>404 — Страница не найдена | Cliply</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#6C5CE7">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; background: #0A0A0F; color: #fff; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .container { text-align: center; max-width: 600px; }
  .error-code { font-size: 180px; font-weight: 800; font-family: 'Manrope'; background: linear-gradient(135deg, #6C5CE7, #A29BFE); -webkit-background-clip: text; -webkit-text-fill-color: transparent; line-height: 1; margin-bottom: 24px; }
  .error-title { font-size: 32px; font-weight: 700; font-family: 'Manrope'; margin-bottom: 16px; }
  .error-desc { color: #A0A0B0; font-size: 18px; margin-bottom: 40px; line-height: 1.6; }
  .error-buttons { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }
  .btn-primary { background: linear-gradient(135deg, #6C5CE7, #A29BFE); color: #fff; padding: 14px 28px; border-radius: 12px; text-decoration: none; font-weight: 600; font-size: 15px; transition: all 0.2s; border: none; cursor: pointer; }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(108, 92, 231, 0.4); }
  .btn-secondary { background: transparent; color: #fff; padding: 14px 28px; border-radius: 12px; text-decoration: none; font-weight: 600; font-size: 15px; border: 1px solid #27272a; transition: all 0.2s; }
  .btn-secondary:hover { border-color: #6C5CE7; background: rgba(108, 92, 231, 0.05); }
  .error-emoji { font-size: 80px; margin-bottom: 24px; opacity: 0.8; }
</style>
</head>
<body>
  <div class="container">
    <div class="error-emoji">🔍</div>
    <div class="error-code">404</div>
    <h1 class="error-title">Страница не найдена</h1>
    <p class="error-desc">Похоже, вы заблудились. Запрашиваемая страница не существует или была перемещена.</p>
    <div class="error-buttons">
      <a href="index.html" class="btn-primary">← На главную</a>
      <a href="faq.html" class="btn-secondary">Помощь</a>
    </div>
  </div>
</body>
</html>
