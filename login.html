<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Cliply — Вход</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth.js"></script>
<link rel="stylesheet" href="toast.css">
<script src="toast.js"></script>
<link rel="stylesheet" href="transitions.css">
<link rel="stylesheet" href="scrollbar.css">
<link rel="stylesheet" href="micro-animations.css">
<script src="transitions.js"></script>
<script src="micro-animations.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; background: #0A0A0F; color: #fff; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  .login-container { width: 100%; max-width: 440px; padding: 24px; }
  .logo { text-align: center; font-weight: 800; font-size: 32px; font-family: 'Manrope'; background: linear-gradient(135deg, #6C5CE7, #A29BFE); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 32px; text-decoration: none; display: block;}
  .tabs { display: flex; gap: 8px; margin-bottom: 24px; background: #15151F; padding: 4px; border-radius: 12px; }
  .tab { flex: 1; padding: 12px; text-align: center; border-radius: 8px; cursor: pointer; color: #A0A0B0; font-weight: 500; transition: 0.2s; }
  .tab.active { background: #6C5CE7; color: #fff; }
  .form { background: #15151F; padding: 32px; border-radius: 16px; border: 1px solid #1f1f2e; }
  .form-group { margin-bottom: 16px; }
  .form-group label { display: block; font-size: 14px; color: #A0A0B0; margin-bottom: 8px; font-weight: 500; }
  .form-group input { width: 100%; background: #0A0A0F; border: 1px solid #27272a; border-radius: 8px; padding: 12px 16px; color: #fff; font-size: 15px; font-family: inherit; }
  .form-group input:focus { outline: none; border-color: #6C5CE7; }
  .btn { width: 100%; background: linear-gradient(135deg, #6C5CE7, #A29BFE); color: #fff; padding: 14px; border-radius: 12px; border: none; font-size: 15px; font-weight: 600; cursor: pointer; transition: 0.2s; margin-top: 8px; }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(108, 92, 231, 0.4); }
  .back-link { text-align: center; margin-top: 24px; }
  .back-link a { color: #A0A0B0; text-decoration: none; font-size: 14px; }
  .back-link a:hover { color: #fff; }
</style>
</head>
<body>
<div class="login-container">
  <a href="index.html" class="logo">Cliply</a>
  
  <div class="tabs">
    <div class="tab active" onclick="switchTab('login')">Вход</div>
    <div class="tab" onclick="switchTab('register')">Регистрация</div>
  </div>
  
  <div class="form">
    <div id="loginForm">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="loginEmail" placeholder="your@email.com">
      </div>
      <div class="form-group">
        <label>Пароль</label>
        <input type="password" id="loginPassword" placeholder="Введите пароль">
      </div>
      <button class="btn" onclick="handleLogin()">Войти</button>
    </div>
    
    <div id="registerForm" style="display:none;">
      <div class="form-group">
        <label>Имя</label>
        <input type="text" id="regName" placeholder="Ваше имя">
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="regEmail" placeholder="your@email.com">
      </div>
      <div class="form-group">
        <label>Пароль</label>
        <input type="password" id="regPassword" placeholder="Минимум 6 символов">
      </div>
      <button class="btn" onclick="handleRegister()">Зарегистрироваться</button>
    </div>
  </div>
  
  <div class="back-link">
    <a href="index.html">← Вернуться на главную</a>
  </div>
</div>

<script>
function switchTab(tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  event.target.classList.add('active');
  if (tab === 'login') {
    document.getElementById('loginForm').style.display = 'block';
    document.getElementById('registerForm').style.display = 'none';
  } else {
    document.getElementById('loginForm').style.display = 'none';
    document.getElementById('registerForm').style.display = 'block';
  }
}

async function handleLogin() {
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  if (!email || !password) { showToast('Заполните все поля', 'error'); return; }
  
  const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
  if (error) {
    showToast(error.message === 'Invalid login credentials' ? 'Неверный email или пароль' : error.message, 'error');
    return;
  }
  window.location.href = 'dashboard.html';
}

async function handleRegister() {
  const name = document.getElementById('regName').value.trim();
  const email = document.getElementById('regEmail').value.trim();
  const password = document.getElementById('regPassword').value;
  if (!name || !email || !password) { showToast('Заполните все поля', 'error'); return; }
  if (password.length < 6) { showToast('Пароль должен содержать минимум 6 символов', 'error'); return; }
  
  const { data, error } = await supabaseClient.auth.signUp({
    email, password, options: { data: { full_name: name } }
  });
  if (error) { showToast(error.message, 'error'); return; }
  
  showToast('Регистрация успешна! Теперь вы можете войти.', 'success');
  setTimeout(() => switchTab('login'), 1500);
}

(async () => {
  const user = await getCurrentUser();
  if (user) window.location.href = 'dashboard.html';
})();
</script>
</body>
</html>
