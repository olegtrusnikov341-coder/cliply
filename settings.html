<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Cliply — Настройки</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; background: #0A0A0F; color: #fff; min-height: 100vh; }
  .layout { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }
  .sidebar { background: #141414; border-right: 1px solid #27272a; padding: 24px 16px; display: flex; flex-direction: column; }
  .sidebar-logo { font-weight: 800; font-size: 22px; font-family: 'Manrope'; background: linear-gradient(135deg, #6C5CE7, #A29BFE); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-decoration: none; margin-bottom: 40px; display: block; }
  .nav-menu { list-style: none; flex: 1; }
  .nav-menu li { margin-bottom: 4px; }
  .nav-menu a { display: flex; align-items: center; gap: 12px; padding: 12px 16px; color: #A0A0B0; text-decoration: none; border-radius: 8px; font-size: 15px; transition: 0.2s; }
  .nav-menu a:hover { background: #1f1f23; color: #fff; }
  .nav-menu a.active { background: rgba(108, 92, 231, 0.15); color: #6C5CE7; border: 1px solid rgba(108, 92, 231, 0.3); }
  .btn-logout { padding: 12px 16px; color: #A0A0B0; text-decoration: none; border-radius: 8px; font-size: 15px; border: 1px solid #27272a; text-align: center; transition: 0.2s; }
  .btn-logout:hover { border-color: #6C5CE7; color: #fff; }
  
  .main { padding: 32px 48px; }
  .header { margin-bottom: 40px; padding-bottom: 24px; border-bottom: 1px solid #27272a; }
  .header h1 { font-size: 28px; font-weight: 700; font-family: 'Manrope'; }
  
  .settings-section { background: #141414; border: 1px solid #27272a; border-radius: 16px; padding: 32px; margin-bottom: 24px; }
  .settings-section h2 { font-size: 20px; margin-bottom: 24px; font-family: 'Manrope'; }
  .form-group { margin-bottom: 20px; }
  .form-group label { display: block; font-size: 14px; color: #A0A0B0; margin-bottom: 8px; font-weight: 500; }
  .form-group input { width: 100%; background: #0A0A0F; border: 1px solid #27272a; border-radius: 8px; padding: 12px 16px; color: #fff; font-size: 15px; font-family: inherit; }
  .form-group input:focus { outline: none; border-color: #6C5CE7; }
  .btn-save { background: linear-gradient(135deg, #6C5CE7, #A29BFE); color: #fff; padding: 14px 32px; border-radius: 12px; border: none; font-size: 15px; font-weight: 600; cursor: pointer; transition: 0.2s; }
  .btn-save:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(108, 92, 231, 0.4); }
  
  @media (max-width: 768px) {
    .layout { grid-template-columns: 1fr; }
    .sidebar { display: none; }
    .main { padding: 20px; }
  }
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <a href="index.html" class="sidebar-logo">Cliply</a>
    <ul class="nav-menu">
      <li><a href="dashboard.html">📊 Дашборд</a></li>
      <li><a href="dashboard.html#projects">🎬 Мои проекты</a></li>
      <li><a href="pricing.html">💎 Тарифы</a></li>
      <li><a href="settings.html" class="active">⚙️ Настройки</a></li>
    </ul>
    <a href="index.html" class="btn-logout">← На лендинг</a>
  </aside>
  
  <main class="main">
    <div class="header">
      <h1>Настройки профиля</h1>
    </div>
    
    <div class="settings-section">
      <h2>Личная информация</h2>
      <div class="form-group">
        <label>Имя</label>
        <input type="text" value="Селлер" placeholder="Ваше имя">
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" value="seller@example.com" placeholder="your@email.com">
      </div>
      <div class="form-group">
        <label>Телефон</label>
        <input type="tel" value="+7 (999) 123-45-67" placeholder="+7 (___) ___-__-__">
      </div>
      <button class="btn-save" onclick="alert('Настройки сохранены!')">Сохранить изменения</button>
    </div>
    
    <div class="settings-section">
      <h2>Безопасность</h2>
      <div class="form-group">
        <label>Текущий пароль</label>
        <input type="password" placeholder="Введите текущий пароль">
      </div>
      <div class="form-group">
        <label>Новый пароль</label>
        <input type="password" placeholder="Введите новый пароль">
      </div>
      <button class="btn-save" onclick="alert('Пароль изменён!')">Изменить пароль</button>
    </div>
  </main>
</div>
</body>
</html>
