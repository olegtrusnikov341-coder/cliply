<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Настройки — Cliply</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#6C5CE7">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth.js"></script>
<link rel="stylesheet" href="toast.css">
<script src="toast.js"></script>
<link rel="stylesheet" href="mobile.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; background: #0A0A0F; color: #fff; min-height: 100vh; }
  .layout { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }
  .sidebar { background: #141414; border-right: 1px solid #27272a; padding: 24px 16px; display: flex; flex-direction: column; }
  .sidebar-logo { font-weight: 800; font-size: 22px; font-family: 'Manrope'; background: linear-gradient(135deg, #6C5CE7, #A29BFE); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-decoration: none; margin-bottom: 40px; display: block; }
  .nav-menu { list-style: none; flex: 1; }
  .nav-menu li { margin-bottom: 4px; }
  .nav-menu a { display: flex; align-items: center; gap: 12px; padding: 12px 16px; color: #A0A0B0; text-decoration: none; border-radius: 8px; font-size: 15px; transition: 0.2s; }
  .nav-menu a:hover { background: #1f1f23; color: #fff; }
  .nav-menu a.active { background: rgba(108, 92, 231, 0.15); color: #6C5CE7; border: 1px solid rgba(108, 92, 231, 0.3); }
  .btn-logout { padding: 12px 16px; color: #A0A0B0; border-radius: 8px; font-size: 15px; border: 1px solid #27272a; text-align: center; transition: 0.2s; cursor: pointer; margin-top: 16px; background: transparent; }
  .btn-logout:hover { border-color: #6C5CE7; color: #fff; }
  
  .main { padding: 32px 48px; }
  .header { margin-bottom: 32px; }
  .header h1 { font-size: 28px; font-weight: 700; font-family: 'Manrope'; margin-bottom: 8px; }
  .header p { color: #A0A0B0; font-size: 15px; }
  
  .settings-card { background: #141414; border: 1px solid #27272a; border-radius: 16px; padding: 28px; margin-bottom: 24px; }
  .settings-card h2 { font-size: 20px; font-weight: 700; font-family: 'Manrope'; margin-bottom: 20px; }
  .settings-card p { color: #A0A0B0; font-size: 14px; margin-bottom: 16px; }
  
  .setting-row { display: flex; justify-content: space-between; align-items: center; padding: 16px 0; border-bottom: 1px solid #1f1f2e; }
  .setting-row:last-child { border-bottom: none; }
  .setting-label { font-size: 15px; font-weight: 500; }
  .setting-desc { font-size: 13px; color: #A0A0B0; margin-top: 4px; }
  .setting-value { color: #6C5CE7; font-weight: 600; font-size: 14px; }
  
  .btn { padding: 10px 20px; border-radius: 8px; border: none; font-size: 14px; font-weight: 600; cursor: pointer; transition: 0.2s; }
  .btn-primary { background: linear-gradient(135deg, #6C5CE7, #A29BFE); color: #fff; }
  .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(108, 92, 231, 0.4); }
  .btn-danger { background: transparent; color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.3); }
  .btn-danger:hover { background: rgba(239, 68, 68, 0.1); border-color: #ef4444; }
  .btn-secondary { background: transparent; color: #A0A0B0; border: 1px solid #27272a; }
  .btn-secondary:hover { border-color: #6C5CE7; color: #fff; }
  
  .profile-info { display: flex; align-items: center; gap: 16px; padding: 20px; background: #0A0A0F; border-radius: 12px; border: 1px solid #1f1f2e; margin-bottom: 20px; }
  .profile-avatar { width: 56px; height: 56px; border-radius: 50%; background: linear-gradient(135deg, #6C5CE7, #A29BFE); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 22px; color: #fff; }
  .profile-details h3 { font-size: 18px; font-weight: 600; margin-bottom: 4px; }
  .profile-details p { color: #A0A0B0; font-size: 14px; }
  
  .danger-zone { border-color: rgba(239, 68, 68, 0.3); background: rgba(239, 68, 68, 0.03); }
  .danger-zone h2 { color: #ef4444; }
  
  @media (max-width: 768px) {
    .sidebar { display: none !important; }
    .layout { grid-template-columns: 1fr !important; }
    .main { padding: 20px 16px !important; }
  }
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <a href="index.html" class="sidebar-logo">Cliply</a>
    <ul class="nav-menu" id="navMenu">
      <li><a href="dashboard.html">📊 Дашборд</a></li>
      <li><a href="admin.html">👑 Админ-панель</a></li>
      <li><a href="support.html">💬 Техподдержка</a></li>
      <li><a href="settings.html" class="active">⚙️ Настройки</a></li>
    </ul>
    <button class="btn-logout" onclick="logout()">Выйти</button>
  </aside>
  
  <main class="main">
    <div class="header">
      <h1>Настройки</h1>
      <p>Управление профилем и аккаунтом</p>
    </div>
    
    <div id="settingsContent">
      <div style="text-align:center;padding:40px;color:#A0A0B0;">Загрузка...</div>
    </div>
  </main>
</div>

<script>
let currentUser = null;

async function initSettings() {
  currentUser = await requireAuth();
  if (!currentUser) return;
  
  renderSettings();
}

function renderSettings() {
  const content = document.getElementById('settingsContent');
  const initial = (currentUser.profile?.full_name || currentUser.email).charAt(0).toUpperCase();
  const role = ROLES[currentUser.profile?.role_level] || { name: 'Селлер', color: '#6C5CE7' };
  
  content.innerHTML = `
    <div class="settings-card">
      <h2>Профиль</h2>
      <div class="profile-info">
        <div class="profile-avatar">${initial}</div>
        <div class="profile-details">
          <h3>${currentUser.profile?.full_name || 'Пользователь'}</h3>
          <p>${currentUser.email}</p>
          <p style="margin-top:4px;"><span class="setting-value" style="color:${role.color};">${role.name}</span></p>
        </div>
      </div>
    </div>
    
    <div class="settings-card">
      <h2>Аккаунт</h2>
      <div class="setting-row">
        <div>
          <div class="setting-label">Email</div>
          <div class="setting-desc">Адрес для входа в аккаунт</div>
        </div>
        <div class="setting-value">${currentUser.email}</div>
      </div>
      <div class="setting-row">
        <div>
          <div class="setting-label">ID пользователя</div>
          <div class="setting-desc">Уникальный идентификатор</div>
        </div>
        <div class="setting-value" style="font-size:12px;">${currentUser.id.substring(0, 8)}...</div>
      </div>
      <div class="setting-row">
        <div>
          <div class="setting-label">Дата регистрации</div>
          <div class="setting-desc">Когда был создан аккаунт</div>
        </div>
        <div class="setting-value">${new Date(currentUser.profile?.created_at || Date.now()).toLocaleDateString('ru-RU')}</div>
      </div>
    </div>
    
    <div class="settings-card">
      <h2>Действия</h2>
      <div class="setting-row">
        <div>
          <div class="setting-label">Сменить пароль</div>
          <div class="setting-desc">Обновить пароль от аккаунта</div>
        </div>
        <button class="btn btn-secondary" onclick="changePassword()">Сменить</button>
      </div>
      <div class="setting-row">
        <div>
          <div class="setting-label">Выйти из аккаунта</div>
          <div class="setting-desc">Завершить текущую сессию</div>
        </div>
        <button class="btn btn-secondary" onclick="logout()">Выйти</button>
      </div>
    </div>
    
    <div class="settings-card danger-zone">
      <h2>⚠️ Опасная зона</h2>
      <p>Эти действия необратимы. Будьте осторожны.</p>
      <div class="setting-row">
        <div>
          <div class="setting-label">Удалить аккаунт</div>
          <div class="setting-desc">Все ваши данные будут удалены без возможности восстановления</div>
        </div>
        <button class="btn btn-danger" onclick="deleteAccount()">Удалить аккаунт</button>
      </div>
    </div>
  `;
}

async function changePassword() {
  const newPass = prompt('Введите новый пароль (минимум 6 символов):');
  if (!newPass || newPass.length < 6) {
    showToast('Пароль должен содержать минимум 6 символов', 'warning');
    return;
  }
  
  try {
    const { error } = await supabaseClient.auth.updateUser({ password: newPass });
    if (error) throw error;
    showToast('Пароль успешно изменён', 'success');
  } catch (e) {
    showToast('Ошибка: ' + e.message, 'error');
  }
}

async function deleteAccount() {
  if (!confirm('Вы уверены? Это действие необратимо!')) return;
  if (!confirm('Точно удалить аккаунт? Все данные будут потеряны!')) return;
  
  showToast('Функция удаления аккаунта в разработке', 'info');
}

const ROLES = {
  1: { name: 'Owner', color: '#6C5CE7' },
  2: { name: 'Admin', color: '#3b82f6' },
  3: { name: 'Moderator', color: '#10b981' }
};

initSettings();
</script>
</body>
</html>
