<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Админ-панель Cliply</title>
<meta name="description" content="Админ-панель Cliply: управление пользователями.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#6C5CE7">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cliply">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="favicon.svg">
<link rel="preconnect" href="https://djvdklcahpqbjotukmxt.supabase.co">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth.js"></script>
<link rel="stylesheet" href="toast.css">
<script src="toast.js"></script>
<link rel="stylesheet" href="transitions.css">
<link rel="stylesheet" href="scrollbar.css">
<link rel="stylesheet" href="micro-animations.css">
<link rel="stylesheet" href="visual-effects.css">
<link rel="stylesheet" href="mobile.css">
<script src="transitions.js"></script>
<script src="micro-animations.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; background: #0A0A0F; color: #fff; min-height: 100vh; }
  .layout { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }
  .sidebar { background: #141414; border-right: 1px solid #27272a; padding: 24px 16px; display: flex; flex-direction: column; }
  .sidebar-logo { font-weight: 800; font-size: 22px; font-family: 'Manrope'; background: linear-gradient(135deg, #6C5CE7, #A29BFE); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-decoration: none; margin-bottom: 40px; display: block; }
  .nav-menu { list-style: none; flex: 1; }
  .nav-menu li { margin-bottom: 4px; }
  .nav-menu a { display: flex; align-items: center; gap: 12px; padding: 12px 16px; color: #A0A0B0; text-decoration: none; border-radius: 8px; font-size: 15px; transition: 0.2s; }
  .nav-menu a:hover { background: #1f1f23; color: #fff; }
  .nav-menu a.active { background: rgba(108, 92, 231, 0.15); color: #6C5CE7; border: 1px solid rgba(108, 92, 231, 0.3); }
  .btn-logout { padding: 12px 16px; color: #A0A0B0; text-decoration: none; border-radius: 8px; font-size: 15px; border: 1px solid #27272a; text-align: center; transition: 0.2s; cursor: pointer; margin-top: 16px; }
  .btn-logout:hover { border-color: #6C5CE7; color: #fff; }
  .main { padding: 32px 48px; }
  .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; padding-bottom: 24px; border-bottom: 1px solid #27272a; }
  .header h1 { font-size: 28px; font-weight: 700; font-family: 'Manrope'; }
  .user-badge { background: rgba(108, 92, 231, 0.15); color: #6C5CE7; padding: 8px 16px; border-radius: 100px; font-size: 14px; font-weight: 600; border: 1px solid rgba(108, 92, 231, 0.3); }
  .admin-section { background: #141414; border: 1px solid #27272a; border-radius: 16px; padding: 32px; margin-bottom: 24px; }
  .admin-section h2 { font-size: 20px; margin-bottom: 24px; font-family: 'Manrope'; }
  .add-user-form { display: grid; grid-template-columns: 2fr 2fr 1fr auto; gap: 12px; margin-bottom: 24px; }
  .add-user-form input, .add-user-form select { background: #0A0A0F; border: 1px solid #27272a; border-radius: 8px; padding: 12px 16px; color: #fff; font-size: 14px; font-family: inherit; }
  .add-user-form input:focus, .add-user-form select:focus { outline: none; border-color: #6C5CE7; }
  .btn-add { background: linear-gradient(135deg, #6C5CE7, #A29BFE); color: #fff; padding: 12px 24px; border-radius: 8px; border: none; font-weight: 600; cursor: pointer; transition: 0.2s; }
  .btn-add:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(108, 92, 231, 0.4); }
  .users-table { width: 100%; border-collapse: collapse; }
  .users-table th { text-align: left; padding: 12px 16px; color: #A0A0B0; font-size: 13px; font-weight: 500; border-bottom: 1px solid #27272a; }
  .users-table td { padding: 16px; border-bottom: 1px solid #1f1f2e; font-size: 14px; }
  .role-badge { padding: 4px 12px; border-radius: 100px; font-size: 12px; font-weight: 600; display: inline-block; }
  .role-1 { background: rgba(108, 92, 231, 0.2); color: #A29BFE; border: 1px solid rgba(108, 92, 231, 0.3); }
  .role-2 { background: rgba(59, 130, 246, 0.2); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.3); }
  .role-3 { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
  .btn-small { padding: 6px 12px; border-radius: 6px; border: 1px solid #27272a; background: transparent; color: #A0A0B0; font-size: 12px; cursor: pointer; margin-right: 4px; transition: 0.2s; }
  .btn-small:hover { border-color: #6C5CE7; color: #fff; }
  .btn-danger { border-color: rgba(239, 68, 68, 0.3); color: #ef4444; }
  .btn-danger:hover { background: rgba(239, 68, 68, 0.1); border-color: #ef4444; }
  select.role-select { background: #0A0A0F; border: 1px solid #27272a; border-radius: 6px; padding: 6px 12px; color: #fff; font-size: 12px; cursor: pointer; }
  .mobile-header { display: none; }
  @media (max-width: 768px) {
    .layout { grid-template-columns: 1fr; }
    .sidebar { display: none !important; }
    .main { padding: 16px !important; }
    .mobile-header { display: flex !important; justify-content: space-between; align-items: center; padding: 16px; background: #141414; border-bottom: 1px solid #27272a; position: sticky; top: 0; z-index: 100; }
    .mobile-header .logo { font-weight: 800; font-size: 20px; font-family: 'Manrope'; background: linear-gradient(135deg, #6C5CE7, #A29BFE); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-decoration: none; }
    .admin-section { padding: 20px !important; }
    .admin-section h2 { font-size: 18px !important; margin-bottom: 16px !important; }
    .add-user-form { grid-template-columns: 1fr !important; gap: 12px !important; }
    .users-table { display: block; overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .users-table th, .users-table td { padding: 12px 8px !important; font-size: 13px !important; white-space: nowrap; }
    .role-select { font-size: 11px !important; padding: 4px 8px !important; }
    .btn-small { padding: 6px 8px !important; font-size: 11px !important; }
  }
</style>
</head>
<body>
<div class="mobile-header" id="mobileHeader">
  <a href="index.html" class="logo">Cliply</a>
  <button class="burger" id="burgerBtn" aria-label="Меню">
    <span></span><span></span><span></span>
  </button>
</div>

<div class="mobile-menu" id="mobileMenu">
  <a href="dashboard.html">📊 Дашборд</a>
  <a href="admin.html" class="active">👑 Админ-панель</a>
  <a href="settings.html">️ Настройки</a>
  <a href="index.html" class="btn-nav-mobile">← На главную</a>
  <a href="#" onclick="logout(); return false;" style="color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.3); margin-top: 16px;">Выйти</a>
</div>

<div class="layout">
  <aside class="sidebar">
    <a href="index.html" class="sidebar-logo">Cliply</a>
    <ul class="nav-menu">
      <li><a href="dashboard.html">📊 Дашборд</a></li>
      <li><a href="admin.html" class="active">👑 Админ-панель</a></li>
      <li><a href="settings.html">⚙️ Настройки</a></li>
    </ul>
    <div class="btn-logout" onclick="logout()">Выйти</div>
  </aside>
  <main class="main">
    <div class="header">
      <h1>Админ-панель</h1>
      <div class="user-badge" id="userBadge">Загрузка...</div>
    </div>
    <div class="admin-section">
      <h2>Добавить участника команды</h2>
      <div class="add-user-form">
        <input type="text" id="newUserName" placeholder="Имя">
        <input type="email" id="newUserEmail" placeholder="Email">
        <select id="newUserRole">
          <option value="3">Moderator (ур. 3)</option>
          <option value="2">Admin (ур. 2)</option>
          <option value="1">Owner (ур. 1)</option>
        </select>
        <button class="btn-add" onclick="addUser()">Создать</button>
      </div>
      <p style="color: #A0A0B0; font-size: 13px;">Система сгенерирует временный пароль.</p>
    </div>
    <div class="admin-section">
      <h2>Пользователи системы</h2>
      <table class="users-table">
        <thead>
          <tr>
            <th>Имя</th>
            <th>Email</th>
            <th>Уровень доступа</th>
            <th>Действия</th>
          </tr>
        </thead>
        <tbody id="usersTableBody">
          <tr><td colspan="4" style="text-align:center; color:#A0A0B0;">Загрузка...</td></tr>
        </tbody>
      </table>
    </div>
  </main>
</div>
<script>
let currentUser = null;

async function init() {
  const checkOwner = requireRole(1);
  currentUser = await checkOwner();
  if (!currentUser) return;
  const role = ROLES[currentUser.profile.role_level];
  document.getElementById('userBadge').textContent = `${currentUser.profile.full_name || currentUser.email} • ${role.name}`;
  await loadUsers();
  if (window.microAnimations) window.microAnimations.initRipple();
  
  const burgerBtn = document.getElementById('burgerBtn');
  const mobileMenu = document.getElementById('mobileMenu');
  if (burgerBtn && mobileMenu) {
    burgerBtn.addEventListener('click', () => {
      burgerBtn.classList.toggle('active');
      mobileMenu.classList.toggle('active');
      document.body.style.overflow = mobileMenu.classList.contains('active') ? 'hidden' : '';
    });
    mobileMenu.querySelectorAll('a').forEach(link => {
      link.addEventListener('click', () => {
        burgerBtn.classList.remove('active');
        mobileMenu.classList.remove('active');
        document.body.style.overflow = '';
      });
    });
  }
}

async function loadUsers() {
  const { data, error } = await supabaseClient.from('profiles').select('*').order('created_at', { ascending: false });
  if (error) { showToast('Ошибка загрузки: ' + error.message, 'error'); return; }
  const tbody = document.getElementById('usersTableBody');
  tbody.innerHTML = '';
  data.forEach(user => {
    const role = ROLES[user.role_level];
    const isCurrentUser = user.id === currentUser.id;
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${user.full_name || '—'}</td>
      <td>${user.email}</td>
      <td><span class="role-badge role-${user.role_level}">${role.name}</span></td>
      <td>
        ${!isCurrentUser ? `
          <select class="role-select" onchange="changeRole('${user.id}', this.value)">
            <option value="1" ${user.role_level === 1 ? 'selected' : ''}>Owner</option>
            <option value="2" ${user.role_level === 2 ? 'selected' : ''}>Admin</option>
            <option value="3" ${user.role_level === 3 ? 'selected' : ''}>Moderator</option>
          </select>
          <button class="btn-small btn-danger" onclick="deleteUser('${user.id}')">Удалить</button>
        ` : '<span style="color:#A0A0B0; font-size:12px;">Это вы</span>'}
      </td>
    `;
    tbody.appendChild(tr);
  });
}

async function addUser() {
  const name = document.getElementById('newUserName').value.trim();
  const email = document.getElementById('newUserEmail').value.trim();
  const role = parseInt(document.getElementById('newUserRole').value);
  if (!name || !email) { showToast('Заполните имя и email', 'warning'); return; }
  const tempPassword = 'Cliply' + Math.random().toString(36).slice(-6);
  const { data, error } = await supabaseClient.rpc('create_user_with_role', {
    p_email: email, p_password: tempPassword, p_full_name: name, p_role_level: role
  });
  if (error) { showToast('Ошибка: ' + error.message, 'error'); return; }
  showToast(`Пользователь ${name} создан! Временный пароль: ${tempPassword}`, 'success', 6000);
  document.getElementById('newUserName').value = '';
  document.getElementById('newUserEmail').value = '';
  await loadUsers();
}

async function changeRole(userId, newRole) {
  if (!confirm('Изменить уровень доступа?')) return;
  const { error } = await supabaseClient.from('profiles').update({ role_level: parseInt(newRole) }).eq('id', userId);
  if (error) { showToast('Ошибка: ' + error.message, 'error'); return; }
  showToast('Уровень доступа изменён', 'success');
  await loadUsers();
}

async function deleteUser(userId) {
  if (!confirm('Удалить этого пользователя навсегда?')) return;
  const { error } = await supabaseClient.rpc('delete_user_by_id', { p_user_id: userId });
  if (error) { showToast('Ошибка: ' + error.message, 'error'); return; }
  showToast('Пользователь удалён', 'success');
  await loadUsers();
}

init();
</script>
</body>
</html>
