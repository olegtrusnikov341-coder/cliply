<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Админ-панель Cliply</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#6C5CE7">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth.js"></script>
<link rel="stylesheet" href="toast.css">
<script src="toast.js"></script>
<link rel="stylesheet" href="mobile.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; background: #0A0A0F; color: #fff; min-height: 100vh; }
  .layout { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }
  .sidebar { background: #141414; border-right: 1px solid #27272a; padding: 24px 16px; display: flex; flex-direction: column; }
  .sidebar-logo { font-weight: 800; font-size: 22px; font-family: 'Manrope'; background: linear-gradient(135deg, #6C5CE7, #A29BFE); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-decoration: none; margin-bottom: 40px; display: block; }
  .nav-menu { list-style: none; flex: 1; }
  .nav-menu li { margin-bottom: 4px; }
  .nav-menu a { display: flex; align-items: center; gap: 12px; padding: 12px 16px; color: #A0A0B0; text-decoration: none; border-radius: 8px; font-size: 15px; transition: 0.2s; }
  .nav-menu a:hover { background: #1f1f23; color: #fff; }
  .nav-menu a.active { background: rgba(108, 92, 231, 0.15); color: #6C5CE7; border: 1px solid rgba(108, 92, 231, 0.3); }
  .btn-logout { padding: 12px 16px; color: #A0A0B0; border-radius: 8px; font-size: 15px; border: 1px solid #27272a; text-align: center; transition: 0.2s; cursor: pointer; margin-top: 16px; background: transparent; }
  .btn-logout:hover { border-color: #6C5CE7; color: #fff; }
  
  .main { padding: 32px 48px; }
  .page-header { margin-bottom: 32px; }
  .page-header h1 { font-size: 28px; font-weight: 700; font-family: 'Manrope'; margin-bottom: 8px; }
  .page-header p { color: #A0A0B0; font-size: 15px; }
  
  /* Вкладки */
  .tabs { display: flex; gap: 4px; margin-bottom: 24px; border-bottom: 1px solid #1f1f2e; padding-bottom: 0; }
  .tab { padding: 12px 20px; background: transparent; border: none; color: #A0A0B0; font-size: 15px; font-weight: 500; cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.2s; margin-bottom: -1px; display: flex; align-items: center; gap: 8px; }
  .tab:hover { color: #fff; }
  .tab.active { color: #6C5CE7; border-bottom-color: #6C5CE7; }
  .tab-badge { background: #ef4444; color: #fff; font-size: 11px; padding: 2px 7px; border-radius: 10px; font-weight: 600; }
  
  .tab-content { display: none; }
  .tab-content.active { display: block; }
  
  /* Карточки */
  .admin-card { background: #141414; border: 1px solid #27272a; border-radius: 16px; padding: 28px; margin-bottom: 24px; }
  .admin-card h2 { font-size: 20px; font-weight: 700; font-family: 'Manrope'; margin-bottom: 20px; }
  
  /* Таблица пользователей */
  .users-table { width: 100%; border-collapse: collapse; }
  .users-table th { text-align: left; padding: 12px 16px; color: #A0A0B0; font-size: 13px; font-weight: 500; border-bottom: 1px solid #1f1f2e; }
  .users-table td { padding: 14px 16px; border-bottom: 1px solid #1f1f2e; font-size: 14px; }
  .btn-small { padding: 6px 12px; border-radius: 6px; border: 1px solid #27272a; background: transparent; color: #A0A0B0; font-size: 13px; cursor: pointer; transition: 0.2s; }
  .btn-small:hover { border-color: #ef4444; color: #ef4444; }
  
  /* Поддержка: Макет */
  .support-layout { display: grid; grid-template-columns: 340px 1fr; gap: 20px; }
  
  /* Список обращений */
  .conv-list-panel { background: #141414; border: 1px solid #1f1f2e; border-radius: 16px; padding: 12px; max-height: 650px; overflow-y: auto; }
  .conv-list-header { padding: 8px 12px 16px; border-bottom: 1px solid #1f1f2e; margin-bottom: 8px; font-size: 14px; font-weight: 600; color: #A0A0B0; }
  
  .conv-list-item { padding: 14px; border-radius: 10px; cursor: pointer; margin-bottom: 6px; transition: all 0.2s; border: 1px solid transparent; }
  .conv-list-item:hover { background: rgba(108, 92, 231, 0.08); }
  .conv-list-item.active { background: rgba(108, 92, 231, 0.15); border-color: #6C5CE7; }
  
  /* СТАТУСЫ ТЕКСТА: Непрочитанное vs Прочитанное */
  .conv-list-item.unread .conv-list-name { color: #ffffff; font-weight: 700; }
  .conv-list-item.unread .conv-list-email { color: #A0A0B0; font-weight: 500; }
  .conv-list-item.unread .conv-list-preview { color: #e2e8f0; font-weight: 500; }
  
  .conv-list-item.read .conv-list-name { color: #666666; font-weight: 400; }
  .conv-list-item.read .conv-list-email { color: #555555; font-weight: 400; }
  .conv-list-item.read .conv-list-preview { color: #555555; font-weight: 400; }
  
  .conv-list-meta { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; }
  .conv-list-date { font-size: 11px; color: #666; }
  .conv-list-status { font-size: 10px; padding: 2px 6px; border-radius: 4px; }
  .conv-list-status.open { background: rgba(234, 179, 8, 0.2); color: #facc15; }
  .conv-list-status.closed { background: rgba(16, 185, 129, 0.2); color: #34d399; }
  .conv-list-empty { text-align: center; color: #A0A0B0; padding: 40px 10px; font-size: 14px; }
  
  /* Чат админа */
  .admin-chat-panel { background: #141414; border: 1px solid #1f1f2e; border-radius: 16px; padding: 24px; display: flex; flex-direction: column; min-height: 650px; }
  .admin-chat-header { padding-bottom: 16px; border-bottom: 1px solid #1f1f2e; margin-bottom: 16px; }
  .admin-chat-header h3 { font-size: 18px; margin-bottom: 4px; }
  .admin-chat-header p { font-size: 13px; color: #A0A0B0; }
  
  .admin-chat-messages { flex: 1; min-height: 350px; max-height: 450px; overflow-y: auto; margin-bottom: 16px; padding: 16px; background: #0A0A0F; border-radius: 12px; border: 1px solid #1f1f2e; }
  .admin-msg { margin-bottom: 16px; padding: 12px 16px; border-radius: 12px; max-width: 80%; animation: msgAppear 0.3s ease; }
  @keyframes msgAppear { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  .admin-msg.user { background: rgba(108, 92, 231, 0.15); border: 1px solid rgba(108, 92, 231, 0.3); margin-left: auto; }
  .admin-msg.admin { background: #1f1f2e; border: 1px solid #27272a; }
  .admin-msg .msg-sender { font-size: 11px; font-weight: 600; margin-bottom: 4px; }
  .admin-msg.user .msg-sender { color: #A29BFE; text-align: right; }
  .admin-msg.admin .msg-sender { color: #6C5CE7; }
  .admin-msg-text { font-size: 15px; line-height: 1.5; }
  .admin-msg-time { font-size: 11px; color: #666; margin-top: 4px; }
  .admin-chat-empty { text-align: center; color: #A0A0B0; padding: 80px 20px; }
  
  .admin-chat-input-area { display: flex; gap: 12px; }
  .admin-chat-input { flex: 1; background: #0A0A0F; border: 1px solid #27272a; border-radius: 12px; padding: 14px 16px; color: #fff; font-size: 15px; font-family: inherit; resize: none; min-height: 50px; max-height: 120px; }
  .admin-chat-input:focus { outline: none; border-color: #6C5CE7; }
  .admin-chat-send { background: linear-gradient(135deg, #6C5CE7, #A29BFE); color: #fff; border: none; border-radius: 12px; padding: 0 24px; font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.2s; white-space: nowrap; }
  .admin-chat-send:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(108, 92, 231, 0.4); }
  .admin-chat-send:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
  
  .admin-chat-actions { display: flex; gap: 8px; margin-top: 12px; }
  .btn-admin-action { padding: 8px 14px; border-radius: 8px; border: 1px solid #27272a; background: transparent; color: #A0A0B0; font-size: 13px; cursor: pointer; transition: 0.2s; }
  .btn-admin-action:hover { border-color: #6C5CE7; color: #fff; }
  .btn-admin-action.danger:hover { border-color: #ef4444; color: #ef4444; }
  
  @media (max-width: 768px) {
    .sidebar { display: none !important; }
    .layout { grid-template-columns: 1fr !important; }
    .main { padding: 20px 16px !important; }
    .support-layout { grid-template-columns: 1fr !important; }
    .conv-list-panel { max-height: 250px; }
  }
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <a href="index.html" class="sidebar-logo">Cliply</a>
    <ul class="nav-menu">
      <li><a href="dashboard.html">📊 Дашборд</a></li>
      <li><a href="admin.html" class="active">👑 Админ-панель</a></li>
      <li><a href="settings.html">⚙️ Настройки</a></li>
    </ul>
    <button class="btn-logout" onclick="logout()">Выйти</button>
  </aside>
  
  <main class="main">
    <div class="page-header">
      <h1>Админ-панель</h1>
      <p>Управление пользователями и поддержка</p>
    </div>
    
    <!-- Вкладки -->
    <div class="tabs">
      <button class="tab active" data-tab="users" onclick="switchTab('users')">👥 Пользователи</button>
      <button class="tab" data-tab="support" onclick="switchTab('support')">
        💬 Поддержка
        <span class="tab-badge" id="openConvCount" style="display:none;">0</span>
      </button>
    </div>
    
    <!-- Вкладка: Пользователи -->
    <div class="tab-content active" id="tab-users">
      <div class="admin-card">
        <h2>Пользователи системы</h2>
        <div style="overflow-x: auto;">
          <table class="users-table">
            <thead>
              <tr>
                <th>Имя</th>
                <th>Email</th>
                <th>Роль</th>
                <th>Действия</th>
              </tr>
            </thead>
            <tbody id="usersTableBody">
              <tr><td colspan="4" style="text-align:center;color:#A0A0B0;padding:30px;">Загрузка...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
    
    <!-- Вкладка: Поддержка -->
    <div class="tab-content" id="tab-support">
      <div class="support-layout">
        <div class="conv-list-panel" id="adminConvList">
          <div class="conv-list-header">Все обращения</div>
          <div class="conv-list-empty">Загрузка обращений...</div>
        </div>
        <div class="admin-chat-panel" id="adminChatPanel">
          <div class="admin-chat-empty">
            <div style="font-size:48px;margin-bottom:12px;opacity:0.5;">👈</div>
            <div>Выберите обращение слева, чтобы ответить</div>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>

<script>
let currentUser = null;
let allUsers = [];
let allConversations = [];
let activeAdminConvId = null;
let supportRefreshInterval = null;

async function initAdmin() {
  currentUser = await requireAuth();
  if (!currentUser) return;
  
  if (currentUser.profile.role_level > 2) {
    showToast('Доступ запрещён', 'error');
    window.location.href = 'dashboard.html';
    return;
  }
  
  await loadUsers();
  await loadAllConversations();
  updateOpenConvBadge();
}

function switchTab(tabName) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  document.querySelector(`.tab[data-tab="${tabName}"]`).classList.add('active');
  document.getElementById(`tab-${tabName}`).classList.add('active');
  
  if (tabName === 'support') {
    startSupportRefresh();
  } else {
    if (supportRefreshInterval) clearInterval(supportRefreshInterval);
  }
}

async function loadUsers() {
  try {
    const { data, error } = await supabaseClient.from('profiles').select('*').order('created_at', { ascending: false });
    if (error) throw error;
    allUsers = data || [];
    renderUsersTable();
  } catch (e) {
    showToast('Ошибка загрузки пользователей', 'error');
  }
}

function renderUsersTable() {
  const tbody = document.getElementById('usersTableBody');
  if (allUsers.length === 0) {
    tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;color:#A0A0B0;padding:30px;">Нет пользователей</td></tr>';
    return;
  }
  tbody.innerHTML = allUsers.map(user => {
    const roleName = user.role_level === 1 ? 'Owner' : user.role_level === 2 ? 'Admin' : 'Moderator';
    return `
      <tr>
        <td><strong>${user.full_name || '—'}</strong></td>
        <td>${user.email}</td>
        <td>${roleName}</td>
        <td><span style="color:#666;font-size:13px;">—</span></td>
      </tr>
    `;
  }).join('');
}

async function loadAllConversations() {
  try {
    const { data, error } = await supabaseClient
      .from('support_conversations')
      .select(`
        id, user_id, user_name, user_email, status, created_at, updated_at,
        support_messages(message, sender, created_at, is_read)
      `)
      .order('updated_at', { ascending: false });
    
    if (error) throw error;
    allConversations = data || [];
    renderAdminConvList();
  } catch (e) {
    console.error('Load conversations error:', e);
    allConversations = [];
  }
}

function updateOpenConvBadge() {
  const openCount = allConversations.filter(c => c.status === 'open').length;
  const badge = document.getElementById('openConvCount');
  if (openCount > 0) {
    badge.textContent = openCount;
    badge.style.display = 'inline';
  } else {
    badge.style.display = 'none';
  }
}

function renderAdminConvList() {
  const list = document.getElementById('adminConvList');
  const header = list.querySelector('.conv-list-header');
  
  if (allConversations.length === 0) {
    list.innerHTML = '<div class="conv-list-header">Все обращения</div><div class="conv-list-empty">Нет обращений</div>';
    return;
  }
  
  let html = '<div class="conv-list-header">Все обращения</div>';
  html += allConversations.map(conv => {
    const msgs = conv.support_messages || [];
    const lastMsg = msgs.length > 0 ? msgs[msgs.length - 1].message : 'Нет сообщений';
    
    // Логика прочитано/непрочитано:
    // Если есть сообщения от пользователя, которые is_read === false, значит непрочитано.
    const hasUnread = msgs.some(m => m.sender === 'user' && m.is_read === false);
    const readClass = hasUnread ? 'unread' : 'read';
    const isActive = conv.id === activeAdminConvId ? 'active' : '';
    
    const date = new Date(conv.updated_at || conv.created_at).toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit' });
    const time = new Date(conv.updated_at || conv.created_at).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
    const statusClass = conv.status === 'open' ? 'open' : 'closed';
    const statusText = conv.status === 'open' ? 'Открыто' : 'Закрыто';
    
    return `
      <div class="conv-list-item ${isActive} ${readClass}" data-id="${conv.id}" onclick="selectAdminConversation('${conv.id}')">
        <div class="conv-list-name">${conv.user_name || 'Гость'}</div>
        <div class="conv-list-email">${conv.user_email || '—'}</div>
        <div class="conv-list-preview">${lastMsg.substring(0, 45)}${lastMsg.length > 45 ? '...' : ''}</div>
        <div class="conv-list-meta">
          <span class="conv-list-date">${date} ${time}</span>
          <span class="conv-list-status ${statusClass}">${statusText}</span>
        </div>
      </div>
    `;
  }).join('');
  
  list.innerHTML = html;
}

async function selectAdminConversation(convId) {
  activeAdminConvId = convId;
  
  document.querySelectorAll('.conv-list-item').forEach(el => el.classList.remove('active'));
  const activeEl = document.querySelector(`.conv-list-item[data-id="${convId}"]`);
  if (activeEl) activeEl.classList.add('active');
  
  const conv = allConversations.find(c => c.id === convId);
  if (!conv) return;
  
  // Помечаем сообщения пользователя как прочитанные
  const unreadMsgs = (conv.support_messages || []).filter(m => m.sender === 'user' && m.is_read === false);
  if (unreadMsgs.length > 0) {
    await supabaseClient
      .from('support_messages')
      .update({ is_read: true })
      .in('id', unreadMsgs.map(m => m.id));
  }
  
  // Загружаем свежие сообщения
  const { data: messages } = await supabaseClient
    .from('support_messages')
    .select('*')
    .eq('conversation_id', convId)
    .order('created_at', { ascending: true });
  
  const date = new Date(conv.created_at).toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
  
  const panel = document.getElementById('adminChatPanel');
  panel.innerHTML = `
    <div class="admin-chat-header">
      <h3>${conv.user_name || 'Гость'} — ${conv.user_email || '—'}</h3>
      <p>Обращение от ${date} • Статус: ${conv.status === 'open' ? '🟡 Открыто' : '✅ Закрыто'}</p>
    </div>
    <div class="admin-chat-messages" id="adminChatMessages">
      ${messages && messages.length > 0 ? messages.map(msg => `
        <div class="admin-msg ${msg.sender}">
          <div class="msg-sender">${msg.sender === 'admin' ? '👨‍💼 Вы (Поддержка)' : '👤 ' + (conv.user_name || 'Пользователь')}</div>
          <div class="admin-msg-text">${msg.message}</div>
          <div class="admin-msg-time">${new Date(msg.created_at).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' })}</div>
        </div>
      `).join('') : '<div class="admin-chat-empty"><div style="font-size:48px;margin-bottom:12px;opacity:0.5;">💬</div><div>Нет сообщений</div></div>'}
    </div>
    <div class="admin-chat-input-area">
      <textarea class="admin-chat-input" id="adminChatInput" placeholder="Напишите ответ..." rows="1"></textarea>
      <button class="admin-chat-send" id="adminChatSend" onclick="sendAdminReply()">Ответить</button>
    </div>
    <div class="admin-chat-actions">
      ${conv.status === 'open' 
        ? `<button class="btn-admin-action" onclick="closeAdminConv()">✅ Закрыть обращение</button>`
        : `<button class="btn-admin-action" onclick="reopenAdminConv()">🔄 Открыть заново</button>`
      }
      <button class="btn-admin-action danger" onclick="deleteAdminConv()">🗑 Удалить</button>
    </div>
  `;
  
  const input = document.getElementById('adminChatInput');
  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 100) + 'px';
  });
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendAdminReply();
    }
  });
  
  setTimeout(() => {
    const msgs = document.getElementById('adminChatMessages');
    if (msgs) msgs.scrollTop = msgs.scrollHeight;
  }, 100);
  
  // Обновляем список, чтобы сбросить статус "непрочитано"
  await loadAllConversations();
}

async function sendAdminReply() {
  const input = document.getElementById('adminChatInput');
  const text = input.value.trim();
  if (!text || !activeAdminConvId) return;
  
  const btn = document.getElementById('adminChatSend');
  btn.disabled = true;
  btn.textContent = '...';
  
  try {
    await supabaseClient.from('support_messages').insert({
      conversation_id: activeAdminConvId,
      sender: 'admin',
      message: text,
      is_read: true
    });
    
    await supabaseClient
      .from('support_conversations')
      .update({ status: 'open', updated_at: new Date().toISOString() })
      .eq('id', activeAdminConvId);
    
    input.value = '';
    input.style.height = 'auto';
    await selectAdminConversation(activeAdminConvId);
    showToast('Ответ отправлен', 'success');
  } catch (e) {
    showToast('Ошибка: ' + e.message, 'error');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Ответить';
  }
}

async function closeAdminConv() {
  if (!activeAdminConvId) return;
  await supabaseClient.from('support_conversations').update({ status: 'closed', updated_at: new Date().toISOString() }).eq('id', activeAdminConvId);
  await loadAllConversations();
  updateOpenConvBadge();
  selectAdminConversation(activeAdminConvId);
  showToast('Обращение закрыто', 'success');
}

async function reopenAdminConv() {
  if (!activeAdminConvId) return;
  await supabaseClient.from('support_conversations').update({ status: 'open', updated_at: new Date().toISOString() }).eq('id', activeAdminConvId);
  await loadAllConversations();
  updateOpenConvBadge();
  selectAdminConversation(activeAdminConvId);
  showToast('Обращение открыто заново', 'success');
}

async function deleteAdminConv() {
  if (!activeAdminConvId) return;
  if (!confirm('Удалить это обращение и все сообщения?')) return;
  await supabaseClient.from('support_conversations').delete().eq('id', activeAdminConvId);
  activeAdminConvId = null;
  await loadAllConversations();
  updateOpenConvBadge();
  renderAdminConvList();
  document.getElementById('adminChatPanel').innerHTML = '<div class="admin-chat-empty"><div style="font-size:48px;margin-bottom:12px;opacity:0.5;">👈</div><div>Выберите обращение слева</div></div>';
  showToast('Обращение удалено', 'success');
}

function startSupportRefresh() {
  if (supportRefreshInterval) clearInterval(supportRefreshInterval);
  supportRefreshInterval = setInterval(async () => {
    await loadAllConversations();
    updateOpenConvBadge();
    if (activeAdminConvId) {
      renderAdminConvList();
    }
  }, 10000);
}

initAdmin();
</script>
</body>
</html>
